# Learning Guide BackOffice — 本地开发数据库（PostgreSQL 16）
# 用法：docker compose up -d postgres    # 停止：docker compose down
# 说明：仅供本地开发；凭据为开发默认值（与 README / server/.env.example 一致），切勿用于生产。
# 若本机已占用 5432 端口，可改用：POSTGRES_PORT=5433 docker compose up -d postgres
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lgbo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-learning_guide_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - lgbo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-learning_guide_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lgbo_pgdata:
